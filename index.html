<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Win Streaks">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>N's Win Streaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#FFFFFF; --phone:#FFFFFF; --ink:#151515; --muted:#7C7B77; --line:#ECEBE7; --chip:#F5F4F1; --frame:#151515;
  --done:#2A62D8; --warn:#E0352B; --pop:#E0352B; --on:#151515; --sky:#DDEAF8;
  --running:#A6F0B2; --social:#FFC4DE; --income:#DDF7A6; --love:#FF9BCB;
  --diet:#8FE39C; --wellbeing:#FCF1A0; --admin:#A9BAFF; --startup:#4FC97C; --networking:#B3E9F7;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --script:"Figtree",system-ui,-apple-system,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E0E0F; --phone:#161617; --ink:#F4F3EF; --muted:#9C9B96; --line:#2A2A2C; --chip:#212123; --frame:#2A2A2C;
    --done:#5B8BF0; --warn:#FF5A4E; --pop:#FF5A4E; --sky:#1B2A3F;
    --running:#8FE09D; --social:#F5AFCD; --income:#CBEB8F; --love:#FF86BD;
    --diet:#7FD68C; --wellbeing:#F4E68A; --admin:#95A9FF; --startup:#46B870; --networking:#9FDCEC;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E0E0F; --phone:#161617; --ink:#F4F3EF; --muted:#9C9B96; --line:#2A2A2C; --chip:#212123; --frame:#2A2A2C;
  --done:#5B8BF0; --warn:#FF5A4E; --pop:#FF5A4E; --sky:#1B2A3F;
  --running:#8FE09D; --social:#F5AFCD; --income:#CBEB8F; --love:#FF86BD;
  --diet:#7FD68C; --wellbeing:#F4E68A; --admin:#95A9FF; --startup:#46B870; --networking:#9FDCEC;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:40px 56px;display:grid;grid-template-columns:400px 1fr;gap:56px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:32px;padding-block:20px 40px}}

/* phone */
.phone{width:100%;max-width:400px;margin:0 auto;background:var(--phone);border:10px solid var(--frame);border-radius:44px;overflow:hidden;position:relative;height:820px;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(28,26,41,.45)}
@media (max-width:480px){.phone{border-radius:18px;height:780px;box-shadow:none;border:1px solid var(--line)}}
.status{display:flex;justify-content:space-between;padding:12px 24px 0;font:500 12px var(--mono);color:var(--muted)}
.scroll{flex:1;overflow-y:auto;padding:8px 18px 24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
.brand{font:700 28px/1 var(--display);letter-spacing:-.02em}
.brand span{color:var(--pop)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.sync{font:400 11px var(--mono);color:var(--muted);text-align:right}
.sync b{display:block;color:var(--ink);font-weight:500}
:focus-visible{outline:2px solid var(--startup);outline-offset:2px}

.chips{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12.5px var(--body);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.chips.wrapped{flex-wrap:wrap;overflow:visible}

/* day summary */
.today{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.today h2{font:700 24px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.today .count{font:500 13px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.today .count b{color:var(--ink);font-size:20px;font-weight:500}
.meter{grid-column:1/-1;display:flex;gap:3px;height:8px;margin-top:6px}
.meter i{flex:1;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,var(--chip))}
.meter i.on{background:var(--c)}

.week{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:500 12px var(--mono);color:var(--muted)}
.week button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;width:30px;height:28px;cursor:pointer;font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.day{border:0;background:transparent;color:var(--ink);border-radius:12px;padding:6px 0 5px;cursor:pointer}
.day small{display:block;font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day strong{font:700 18px var(--display)}
.day.is-today strong{color:var(--pop)}
.day i{display:flex;justify-content:center;gap:2px;height:6px;margin-top:2px}
.day i b{width:5px;height:5px;border-radius:50%;border:1.2px solid var(--c)}
.day i b.on{background:var(--c)}
.day[aria-pressed="true"]{background:color-mix(in srgb,var(--pop) 14%,var(--phone))}

.group{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:18px;display:flex;justify-content:space-between;gap:8px}
.group.warn{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* item row */
.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);background:var(--phone);border-radius:14px;padding:10px 12px 10px 10px;cursor:pointer;text-align:left}
.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:#1B1530;margin-top:1px}
.check svg{width:15px;height:15px;opacity:0}
.check[aria-pressed="true"]{background:var(--c)}
.check[aria-pressed="true"] svg{opacity:1}
.item .title{font:600 15px/1.3 var(--body);text-wrap:balance}
.item.is-done .title{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent);color:var(--muted)}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .time{font:500 12.5px var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:600 10.5px var(--mono);padding:2px 7px;border-radius:6px;color:var(--on);background:color-mix(in srgb,var(--c) 38%,var(--phone));margin-top:6px}
.tag.ex{--c:var(--line)}
.move{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:8px;font:600 11.5px var(--body);padding:3px 8px;cursor:pointer;margin-top:2px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 10px;font-size:14px}

/* week view */
.wday{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.wday h3{margin:0;font:700 15px var(--display);display:flex;justify-content:space-between;align-items:baseline}
.wday h3 span{font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.wday.is-today h3{color:var(--pop)}
.row{display:grid;grid-template-columns:24px 46px 1fr;gap:8px;align-items:center;padding:5px 0;cursor:pointer;border-radius:8px}
.row .check{width:22px;height:22px;border-width:2px;margin:0}
.row .check svg{width:12px;height:12px}
.row .t{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.is-done .n{color:var(--muted);text-decoration:line-through}
.row.is-missed .n{color:var(--warn)}
.wempty{font-size:13px;color:var(--muted);padding:4px 0}

/* record view */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px;margin-top:16px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--phone);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:color-mix(in srgb,var(--c) 22%,var(--phone));border-radius:12px;padding:10px 12px}
.stat:nth-child(1){--c:var(--social)}.stat:nth-child(2){--c:var(--income)}.stat:nth-child(3){--c:var(--wellbeing)}
.stat b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:92px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .nm{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.bar .nm i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,var(--chip));overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:5px}
.bar .v{font:500 12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.bar .v b{color:var(--ink);font-weight:500}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--chip)}
.heat i.l1{background:color-mix(in srgb,var(--done) 30%,var(--chip))}
.heat i.l2{background:color-mix(in srgb,var(--done) 55%,var(--chip))}
.heat i.l3{background:color-mix(in srgb,var(--done) 80%,var(--chip))}
.heat i.l4{background:var(--done)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:1px}
.heatkey{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--muted);margin-top:6px}
.heatkey span{display:flex;gap:3px;align-items:center}
.heatkey i{width:10px;height:10px;border-radius:2px;display:inline-block}
.log{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.logrow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.logrow i{width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px)}
.logrow .n{font-size:14px}
.logrow .r{display:block;font-size:12.5px;color:var(--muted);font-style:italic}
.logrow .a{font:500 12px var(--mono);color:var(--muted)}
.clear{margin-top:22px;display:flex;justify-content:center}

/* form */
.form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.form h2{font:700 24px/1.15 var(--display);margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.legend{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.quick textarea{font:15px var(--body);color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,.quick textarea:focus{outline:none;border-color:var(--startup)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.quick{border:1.5px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.quick .legend{color:var(--ink)}
.quick textarea{font-size:14px;min-height:60px;resize:vertical;border:0}
.parsed{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--chip);border-radius:10px;padding:7px 10px;font-size:13px}
.prow small{display:block;font:400 11px var(--mono);color:var(--muted)}
.prow button{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.small{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.small.primary{background:var(--ink);color:var(--phone)}
.small:disabled{opacity:.5;cursor:default}
.small.danger{border-color:var(--love);color:var(--love)}
.msg{font-size:12.5px;color:var(--muted);min-height:1em}
.msg.err{color:var(--love)}
.btn{flex:1;border-radius:12px;padding:12px;font:700 14px var(--body);cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--phone)}
.btn.go{background:var(--done);border-color:var(--done);color:#1B1530}
.btn.danger{border-color:var(--love);color:var(--love)}
.btn:disabled{opacity:.5;cursor:default}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:8px 0 14px;background:var(--phone)}
.tab{border:0;background:transparent;color:var(--muted);font:600 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab.add svg{background:var(--pop);color:#fff;border-radius:50%;padding:3px}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(15,14,22,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--phone);width:100%;border-radius:22px 22px 0 0;padding:10px 20px 24px;max-height:86%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:700 24px/1.15 var(--display);margin:6px 0 4px;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13.5px}
.facts dt{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0}
.facts .ok{color:color-mix(in srgb,var(--done) 65%,var(--ink));font-weight:600}
.facts .late{color:var(--warn);font-weight:600}
.sheet p{font-size:14px;margin:0 0 12px}
.actions{display:flex;gap:10px;margin-top:12px}
.reflect{background:var(--chip);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.reflect .field input,.reflect .field textarea{background:var(--phone)}
.toast{position:absolute;left:18px;right:18px;bottom:78px;background:var(--ink);color:var(--phone);border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:6}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px)}}.check{transition:background .15s}}

/* celebration */
.party{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:90px 18px 20px;cursor:pointer;overflow:hidden;
  background:color-mix(in srgb,var(--frame) 42%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4)}
.pcard{position:relative;width:100%;max-width:300px;text-align:center;border-radius:30px;padding:0 18px 16px;border:3px solid transparent;
  background:linear-gradient(var(--phone),var(--phone)) padding-box,linear-gradient(135deg,var(--social),var(--running) 45%,var(--income) 75%,var(--wellbeing)) border-box;
  box-shadow:0 30px 60px -18px color-mix(in srgb,var(--social) 55%,transparent),0 8px 24px -10px rgba(0,0,0,.35)}
.pcard::before{content:"";position:absolute;inset:0;border-radius:27px;background:radial-gradient(120% 70% at 50% 0,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);pointer-events:none}
.stk{position:relative;width:150px;margin:-86px auto 0;filter:drop-shadow(0 12px 16px color-mix(in srgb,var(--c) 45%,transparent))}
.stk svg{width:100%;height:auto;display:block;overflow:visible}
.phead{position:relative;font:700 38px/1 var(--display);letter-spacing:-.03em;margin-top:6px;background:linear-gradient(90deg,var(--social),var(--running),var(--income));-webkit-background-clip:text;background-clip:text;color:transparent}
.pcheer{position:relative;font-weight:600;font-size:15.5px;margin-top:6px}
.ptask{position:relative;display:inline-flex;align-items:center;gap:8px;max-width:100%;margin-top:10px;background:color-mix(in srgb,var(--c) 18%,var(--phone));border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:500}
.ptask span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.pstats div{background:color-mix(in srgb,var(--c) 24%,var(--phone));border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column}
.pstats b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pstats span{font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.psweep{position:relative;margin-top:10px;border-radius:14px;padding:8px 10px;font:700 13.5px var(--body);color:#1B1530;background:linear-gradient(90deg,var(--income),var(--diet))}
.phint{position:relative;margin-top:12px;font-size:11.5px;color:var(--muted)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;left:50%;top:40%;width:8px;height:13px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .party{animation:fadein .2s ease-out}
  @keyframes fadein{from{opacity:0}}
  .stk{animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) backwards}
  @keyframes pop{from{transform:scale(.2) rotate(-20deg)}}
  .pcard{animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
  .pstats div{animation:rise .45s cubic-bezier(.2,1.3,.4,1) backwards}.pstats div:nth-child(2){animation-delay:.08s}.pstats div:nth-child(3){animation-delay:.16s}
  .confetti i{animation:burst 1.5s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
  .stk .all{animation:bounce .5s ease-in-out infinite alternate}
  .stk .bod{animation:sway .5s ease-in-out infinite alternate}
  .stk .arm.l{animation:waveL .3s ease-in-out infinite alternate}
  .stk .arm.r{animation:waveR .3s ease-in-out infinite alternate}
  .stk .leg.l{animation:kickL .5s ease-in-out infinite alternate}
  .stk .leg.r{animation:kickR .5s ease-in-out infinite alternate}
  .stk .prop{animation:spinx .25s linear infinite}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
  @keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes waveL{from{transform:rotate(-30deg)}to{transform:rotate(40deg)}}
  @keyframes waveR{from{transform:rotate(30deg)}to{transform:rotate(-40deg)}}
  @keyframes kickL{from{transform:rotate(-5deg)}to{transform:rotate(20deg)}}
  @keyframes kickR{from{transform:rotate(5deg)}to{transform:rotate(-20deg)}}
  @keyframes spinx{to{transform:scaleX(-1)}}
  /* dance moves */
  .d-wiggle .bod{animation-duration:.18s}
  .d-wiggle .arm.l,.d-wiggle .arm.r{animation-duration:.16s}
  .d-hop .all{animation:hop .42s cubic-bezier(.3,0,.6,1) infinite alternate}
  @keyframes hop{from{transform:translateY(0) scaleY(.94)}to{transform:translateY(-30px) scaleY(1.03)}}

function gAuth(silent){
  const st=Math.random().toString(36).slice(2);
  try{sessionStorage.setItem("ws-gstate",st);if(silent)sessionStorage.setItem("ws-gsilent","1")}catch(e){}
  const q=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:"token",scope:GSCOPE,include_granted_scopes:"true",state:st});
  if(silent)q.set("prompt","none");
  location.href="https://accounts.google.com/o/oauth2/v2/auth?"+q;
}
function gReadRedirect(){
  if(!/access_token=|error=/.test(location.hash))return;
  const h=new URLSearchParams(location.hash.slice(1)); history.replaceState(null,"",location.pathname);
  let st="";try{st=sessionStorage.getItem("ws-gstate")||""}catch(e){}
  if(!st||h.get("state")!==st)return;
  if(h.get("access_token")){gTok={t:h.get("access_token"),exp:Date.now()+((Number(h.get("expires_in"))||3600)-60)*1000};
    try{localStorage.setItem("ws-gtok",JSON.stringify(gTok));localStorage.setItem("ws-gon","1")}catch(e){}}
}
async function gFetch(url,opt={}){
  if(!gTok||Date.now()>gTok.exp)throw {code:"expired"};
  const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+gTok.t,"Content-Type":"application/json"}});
  if(r.status===401){gTok=null;try{localStorage.removeItem("ws-gtok")}catch(e){}throw {code:"expired"}}
  if(!r.ok)throw {code:"http",status:r.status};
  return r.status===204?null:r.json();
}
function gExpired(){
  let on=false,tried=false;try{on=localStorage.getItem("ws-gon")==="1";tried=sessionStorage.getItem("ws-gsilent")==="1"}catch(e){}
  if(on&&!tried){gAuth(true);return}

}
async function gRefresh(){

  const from=iso(addDays(TODAY,-45))>SYNC_FROM?iso(addDays(TODAY,-45)):SYNC_FROM;
  const q=new URLSearchParams({timeMin:from+"T00:00:00+03:00",timeMax:iso(addDays(TODAY,150))+"T00:00:00+03:00",singleEvents:"true",orderBy:"startTime",maxResults:"250",timeZone:TZ});
  try{const d=await gFetch(GAPI+"?"+q);gEvents=Array.isArray(d?.items)?d.items:[];gState={s:"ok",msg:""};gRebuild();gLinkAndPull();gSchedulePush()}
  catch(e){if(e?.code==="expired")gExpired();else{gState={s:"error",msg:"Couldn't reach Google Calendar"};render()}}
}
function gRebuild(){
  const out=[];
  for(const ev of gEvents){
    if(!ev||ev.status==="cancelled")continue; {const mk=/\[ws:([^\]]+)\]/.exec(ev.description||""); if(mk&&appItems.some(x=>x.id===mk[1]||x.gid===ev.id))continue}
    const me=(ev.attendees||[]).find(a=>a.self); if(me&&me.responseStatus==="declined")continue;
    const s0=ev.start||{}, e0=ev.end||{}, allDay=!s0.dateTime, d0=String(s0.dateTime||s0.date||"").slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d0))continue;
    const days=[d0];
    if(allDay){const d1=String(e0.date||"").slice(0,10);let d=parse(d0);while(days.length<14){d=addDays(d,1);if(!d1||iso(d)>=d1)break;days.push(iso(d))}}
    const m=gMeta[ev.id]||{}, title=clean(ev.summary||"(No title)",120);
    days.forEach((date,i)=>out.push({id:"g:"+ev.id+(i?":"+i:""),gid:ev.id,google:true,link:typeof ev.htmlLink==="string"?ev.htmlLink:"",
      title,area:m.area in AREAS?m.area:guessArea(title+" "+(ev.location||"")),date,t:allDay?"":String(s0.dateTime).slice(11,16),end:allDay?"":String(e0.dateTime||"").slice(11,16),
      done:!!m.done,doneAt:m.doneAt||null,amount:Number(m.amount)||null,notes:clean(ev.location||"",200),reflection:clean(m.reflection||"",800),example:false,createdAt:0}));
  }

}
function gTimes(e){
  if(!e.t)return {allDay:true,startTime:`${e.date}T00:00:00`,endTime:`${iso(addDays(parse(e.date),1))}T00:00:00`};
  let end=e.end&&e.end>e.t?e.end:"";

  return {startTime:`${e.date}T${e.t}:00`,endTime:`${e.date}T${end}:00`};
}
function gBody(e){const t=gTimes(e);return t.allDay?{summary:e.title,start:{date:e.date},end:{date:iso(addDays(parse(e.date),1))}}:{summary:e.title,start:{dateTime:t.startTime,timeZone:TZ},end:{dateTime:t.endTime,timeZone:TZ}}}
// events made here carry a marker so Google edits flow back and nothing shows twice
function gLinkAndPull(){
  for(const ev of gEvents){
    const mk=/\[ws:([^\]]+)\]/.exec(ev?.description||""); if(!mk)continue;
    const it=appItems.find(x=>x.id===mk[1]); if(!it)continue;
    const s0=ev.start||{}, e0=ev.end||{};
    const g={title:clean(ev.summary||it.title,120),date:String(s0.dateTime||s0.date||"").slice(0,10),t:s0.dateTime?String(s0.dateTime).slice(11,16):"",end:s0.dateTime?String(e0.dateTime||"").slice(11,16):""};
    if(!/^\d{4}-\d{2}-\d{2}$/.test(g.date))continue;
    if(!it.gid){setItem(it.id,{gid:ev.id,gsig:gsig(it)});continue}
    if(it.gid===ev.id&&it.gsig===gsig(it)&&gsig(g)!==it.gsig){setItem(it.id,{...g,gsig:gsig(g)});render()}
  }
}
function gSchedulePush(){clearTimeout(gPushTimer);gPushTimer=setTimeout(gPush,1200)}
async function gPush(){
  if(gBusy||gStopPush||gState.s!=="ok"||!gTok)return; gBusy=true; let changed=false;
  const from=iso(addDays(TODAY,-1))>SYNC_FROM?iso(addDays(TODAY,-1)):SYNC_FROM;
  try{
    for(const e of appItems.slice()){
      if(e.example||e.date<from)continue;
      if(!e.gid&&!e.gpush){
        setItem(e.id,{gpush:Date.now()});
        const r=await gFetch(GAPI,{method:"POST",body:JSON.stringify({...gBody(e),description:`Added from N's Win Streaks · ${AREAS[e.area]?.n||""}\n[ws:${e.id}]`,reminders:{useDefault:true}})});
        if(r&&typeof r.id==="string")setItem(e.id,{gid:r.id,gsig:gsig(e)}); changed=true;
      } else if(e.gid&&e.gsig!==gsig(e)){
        await gFetch(GAPI+"/"+encodeURIComponent(e.gid),{method:"PATCH",body:JSON.stringify(gBody(e))});
        setItem(e.id,{gsig:gsig(e)}); changed=true;
      }
    }
  }catch(err){if(err?.code==="expired")gExpired();else{gStopPush=true;gState={s:"error",msg:"Couldn't update Google Calendar"};render()}}
  finally{gBusy=false}
}
async function gDelete(gid){if(!gid||!gTok)return;try{await gFetch(GAPI+"/"+encodeURIComponent(gid),{method:"DELETE"})}catch(err){toast("Couldn't remove it from Google Calendar")}}
function initGoogle(){
  loadGMetaLocal();

// drag to-dos up and down: grab the dots, or press and hold anywhere on a to-do
let tdrag=null, tpress=null;
function startTodoDrag(row,y){
  const rows=[...row.parentElement.querySelectorAll(".todo.movable")]; if(rows.length<2)return;
  const rects=rows.map(r=>r.getBoundingClientRect()), idx=rows.indexOf(row);
  tdrag={row,rows,rects,y0:y,idx,to:idx,h:rects[idx].height+8};
  row.classList.add("dragging"); navigator.vibrate?.(8);
}
function moveTodoDrag(y){
  const d=tdrag, dy=y-d.y0, c=d.rects[d.idx].top+d.rects[d.idx].height/2+dy;
  d.row.style.transform=`translate3d(0,${dy}px,0)`;
  let to=0; d.rects.forEach((r,i)=>{if(i!==d.idx&&r.top+r.height/2<c)to++}); d.to=to;
  d.rows.forEach((r,i)=>{if(i===d.idx)return; const sh=d.idx<to&&i>d.idx&&i<=to?-d.h:d.idx>to&&i>=to&&i<d.idx?d.h:0; r.style.transform=sh?`translate3d(0,${sh}px,0)`:""});
}
async function endTodoDrag(){
  const d=tdrag; tdrag=null; if(!d)return;
  const ids=d.rows.map(r=>r.dataset.tid); const [m]=ids.splice(d.idx,1); ids.splice(d.to,0,m);
  d.rows.forEach(r=>{r.style.transform="";r.classList.remove("dragging")});
  swipedAt=Date.now();
  if(d.to===d.idx)return;
  const changed=[]; ids.forEach((id,i)=>{const t=todos.find(x=>x.id===id);const o=(i+1)*1000;if(t&&t.order!==o){t.order=o;changed.push(t)}});
  swipedAt=Date.now(); render();
  if(live()){for(const t of changed){try{await db.doc("todos/"+t.id).update({order:t.order})}catch(err){toast(writeErr(err));return}}}else saveTodosLocal();
}
document.addEventListener("pointerdown",ev=>{
  const row=ev.target.closest(".todo.movable"); if(!row||ev.button>0)return;
  if(ev.target.closest(".thandle")){startTodoDrag(row,ev.clientY);return}
  if(ev.target.closest("button,input,select,textarea"))return;
  tpress={row,x:ev.clientX,y:ev.clientY,timer:setTimeout(()=>{if(tpress){startTodoDrag(tpress.row,tpress.y);tpress=null}},260)};
},{passive:true});
document.addEventListener("pointermove",ev=>{
  if(tpress&&(Math.abs(ev.clientX-tpress.x)>8||Math.abs(ev.clientY-tpress.y)>8)){clearTimeout(tpress.timer);tpress=null}
  if(tdrag)moveTodoDrag(ev.clientY);

function ledger(){
  const ws=state.winWeek, wsD=parse(ws), thisWeek=iso(weekOf(TODAY));

  const days=[...Array(7)].map((_,i)=>iso(addDays(wsD,i)));
  const best=Math.max(1,...days.map(d=>winsOn(d).length));
  const diff=week.length-last;
  const vs=ws>thisWeek?"":last||week.length?(diff>0?`${diff} more than last week`:diff<0?`${-diff} fewer than last week`:"Same as last week"):"";
  return `<section class="ledger" id="ledger" aria-label="Wins">

function recordView(){

  const due=inR.filter(e=>e.date<=T), done=inR.filter(e=>e.done);
  const rate=due.length?Math.round(done.filter(e=>e.date<=T).length/due.length*100):0;

  // heatmap
  const start=addDays(weekOf(TODAY),-77); const counts={};

  let cells="";

    cells+=`<i class="${k>T?"fut":n>=4?"l4":n?"l"+n:""} ${k===T?"now":""}" title="${label(k)}: ${n} done"></i>`}
  h+=`<div class="group"><span>Last 12 weeks</span><span>Sun → Sat, top to bottom</span></div><div class="heat" aria-label="Completed entries per day, last 12 weeks">${cells}</div>
    <div class="heatkey"><span>${label(iso(start))}</span><span>0 <i style="background:var(--chip)"></i><i class="" style="background:color-mix(in srgb,var(--done) 30%,var(--chip))"></i><i style="background:color-mix(in srgb,var(--done) 80%,var(--chip))"></i><i style="background:var(--done)"></i> 4+</span></div>`;
  h+=ledger();
  h+=`<div class="backup"><button class="small" data-export>Export backup</button><label class="small" for="importFile">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>`;
  if(items.some(e=>e.example))h+=`<div class="clear"><button class="small danger" data-clear>${confirmClear?"Tap again to delete all examples":"Clear example entries"}</button></div>`;
  return h;
}

function occurrences(date,repeat,times){
  const out=[];let d=parse(date);const n=repeat==="none"?1:Math.min(12,Math.max(1,parseInt(times)||1));
  while(out.length<n){
    if(repeat==="weekdays"&&(d.getDay()===5||d.getDay()===6)){d=addDays(d,1);continue}
    out.push(iso(d)); d=addDays(d,repeat==="weekly"?7:1);
  }
  return out;
}

  if(draft.editId){

let slideDir="", swipe=null, swipedAt=0, dayShift=false;
function shiftDay(n,quiet){const d=addDays(parse(state.day),n);state.day=iso(d);const ws=parse(state.weekStart);
  if(d<ws||d>addDays(ws,6))state.weekStart=iso(weekOf(d));slideDir=quiet?"":n>0?"next":"prev";dayShift=true;render();slideDir="";dayShift=false}
function shiftWeek(n,quiet){const ws=addDays(parse(state.weekStart),n);state.weekStart=iso(ws);
  state.day=(T>=iso(ws)&&T<=iso(addDays(ws,6)))?T:iso(ws);slideDir=quiet?"":n>0?"next":"prev";render();slideDir=""}
function shiftMonth(n,quiet){const ms=parse(state.monthStart);const m=new Date(ms.getFullYear(),ms.getMonth()+n,1);state.monthStart=iso(m);
  const a=iso(m),b=iso(new Date(m.getFullYear(),m.getMonth()+1,0));state.day=(T>=a&&T<=b)?T:a;slideDir=quiet?"":n>0?"next":"prev";render();slideDir=""}
// the dates follow your finger (GPU transform on the dragged block only), then carry on into the next day/week/month
function dragKind(t){if(t.closest(".chips,.tabs,.sheet-bg,input,textarea,select"))return null;
  if(t.closest(".days"))return "strip"; if(t.closest(".mgrid"))return "grid";
  if(t.closest(".week"))return state.view==="month"?"grid":state.view==="week"?"weekv":"strip";
  if(state.view==="week"&&t.closest(".wday"))return "weekv";
  if(state.view==="day"&&t.closest(".dayarea"))return "dayv"; return null}
function dragEls(k){const q=x=>[...document.querySelectorAll("#scroll "+x)];
  return k==="strip"?q(".days"):k==="grid"?q(".mgrid"):k==="dayv"?q(".dayarea"):q(".wday")}
function setX(els,x,o){els.forEach(el=>{el.style.transform=x?`translate3d(${x}px,0,0)`:"";el.style.opacity=o==null?"":o})}
let rafId=0;
document.addEventListener("pointerdown",ev=>{
  if(ev.button>0||moving)return; const k=dragKind(ev.target);
  swipe=k?{k,x:ev.clientX,y:ev.clientY,lx:ev.clientX,lt:performance.now(),v:0,lock:null,els:null,dx:0}:null;
},{passive:true});
document.addEventListener("pointermove",ev=>{
  if(!swipe)return; const dx=ev.clientX-swipe.x, dy=ev.clientY-swipe.y;
  if(!swipe.lock){if(Math.abs(dx)<5&&Math.abs(dy)<5)return; swipe.lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(swipe.lock==="x"){swipe.els=dragEls(swipe.k);swipe.els.forEach(el=>{el.style.transition="none";el.style.willChange="transform"})}}
  if(swipe.lock!=="x")return;
  const now=performance.now(); swipe.v=.7*swipe.v+.3*((ev.clientX-swipe.lx)/Math.max(1,now-swipe.lt)); swipe.lx=ev.clientX; swipe.lt=now; swipe.dx=dx;
  if(!rafId)rafId=requestAnimationFrame(()=>{rafId=0;if(swipe&&swipe.els)setX(swipe.els,swipe.dx)});
},{passive:true});
let moving=false;
function finishSwipe(sw){
  const {k,els,dx,v}=sw; if(!els||!els.length)return;
  const w=els[0].offsetWidth||320, go=Math.abs(dx)>w*.18||(Math.abs(dx)>10&&Math.abs(v)>.25);
  if(!go){els.forEach(el=>el.style.transition="transform .18s cubic-bezier(.2,.8,.3,1)");setX(els,0);setTimeout(()=>els.forEach(el=>{el.style.transition="";el.style.willChange=""}),200);return}
  const dir=dx<0?1:-1, out=Math.max(80,Math.min(300,280*Math.abs(v)))||120;
  moving=true;
  els.forEach(el=>el.style.transition="transform .13s ease-in, opacity .13s ease-in");
  setX(els,-dir*w*.6,".15");
  setTimeout(()=>{
    k==="grid"?shiftMonth(dir,true):k==="dayv"?shiftDay(dir,true):shiftWeek(dir*7,true);
    dragEls(k).forEach(el=>el.animate([{transform:`translate3d(${dir*w*.45}px,0,0)`,opacity:.15},{transform:"translate3d(0,0,0)",opacity:1}],{duration:210,easing:"cubic-bezier(.15,.85,.3,1)"}));
    moving=false;
  },125);
}

    patch(e.id,{done:nd,doneAt:nd?Date.now():null});

  const ww=t.closest("[data-winweek]");if(ww){state.winWeek=iso(addDays(parse(state.winWeek),+ww.dataset.winweek));render();return}
  if(t.closest("[data-toledger]")){state.winWeek=iso(weekOf(TODAY));setView("record");document.getElementById("ledger")?.scrollIntoView({block:"start"});return}
  const mv=t.closest("[data-move]");if(mv){ev.stopPropagation();patch(mv.dataset.move,{date:T});toast("Moved to today");return}
  const mt=t.closest("[data-moveto]");if(mt){const [id,d]=mt.dataset.moveto.split("|");patch(id,{date:d});$(".sheet-bg")?.remove();toast("Moved to "+label(d));return}
  const sn=t.closest("[data-savenote]");if(sn){const p={reflection:clean($("#s-refl")?.value,800)};if($("#s-amt"))p.amount=Number($("#s-amt").value)||null;document.activeElement?.blur();patch(sn.dataset.savenote,p);toast("Note saved");return}
  const ed=t.closest("[data-edit]");if(ed){const e=find(ed.dataset.edit);$(".sheet-bg")?.remove();
    draft={editId:e.id,title:e.title,area:e.area,date:e.date,t:e.t,end:e.end,repeat:"none",times:1,amount:e.amount??"",notes:e.notes};formMsg="";setView("add");return}
  const dl=t.closest("[data-del]");if(dl){const id=dl.dataset.del;if(confirmDel!==id){confirmDel=id;dl.textContent="Tap again to delete";return}
    $(".sheet-bg")?.remove();confirmDel=null;removeIds([id]).then(ok=>ok&&toast("Deleted"));return}
  if(t.closest("[data-fresh]")){dietConfirm=true;render();document.getElementById("dayone")?.focus();return}
  if(t.closest("[data-setone]")){setDayOne(document.getElementById("dayone")?.value);return}
  if(t.closest("[data-cancelone]")){dietConfirm=false;render();return}
  if(t.closest("[data-clear]")){if(!confirmClear){confirmClear=true;render();return}confirmClear=false;
    removeIds(items.filter(e=>e.example).map(e=>e.id)).then(ok=>ok&&toast("Example entries cleared"));return}
  if(t.closest("[data-cancel]")){draft=blank();formMsg="";setView("day");return}
  const fa=t.closest("[data-farea]");if(fa){readForm();draft.area=fa.dataset.farea;render();return}
  const up=t.closest("[data-unparse]");if(up){parsed.splice(+up.dataset.unparse,1);if(!parsed.length)quickMsg="";render();return}
  if(t.closest("#quickGo")){runQuick();return}
  if(t.closest("#quickAdd")){addParsed();return}
  const ar=t.closest("[data-area]");if(ar){state.area=ar.dataset.area;render();return}
  const rg=t.closest("[data-range]");if(rg){state.range=rg.dataset.range;render();return}
  const mo=t.closest("[data-month]");if(mo){shiftMonth(+mo.dataset.month);return}
  const md=t.closest("[data-mday]");if(md){state.day=md.dataset.mday;render();return}
  const od=t.closest("[data-openday]");if(od){const d=od.dataset.openday;state.day=d;state.weekStart=iso(weekOf(parse(d)));setView("day");return}
  const wk=t.closest("[data-week]");if(wk){shiftWeek(+wk.dataset.week);return}
  const dy=t.closest("[data-day]");if(dy){state.day=dy.dataset.day;render();return}
  const go=t.closest("[data-go]");if(go){draft=blank();setView(go.dataset.go);return}
  const tb=t.closest("[data-view]");if(tb){if(tb.dataset.view==="add"&&!draft.editId&&!draft.title)draft.date=state.day;setView(tb.dataset.view);return}
  const op=t.closest("[data-open]");if(op)openSheet(op.dataset.open);
});
document.addEventListener("focusout",ev=>{if(ev.target.id==="tedit"&&todoEdit)setTimeout(saveTodoEdit,0)});
document.addEventListener("submit",ev=>{if(ev.target.id==="schedForm"){ev.preventDefault();scheduleTodo();return}if(ev.target.id==="todoForm"){ev.preventDefault();const v=$("#todoIn")?.value||"";todoDraft="";addTodo(v);setTimeout(()=>$("#todoIn")?.focus(),0);return}if(ev.target.id==="planForm"){ev.preventDefault();submitForm()}});
document.addEventListener("change",ev=>{if(ev.target.id==="importFile"&&ev.target.files?.[0]){importBackup(ev.target.files[0]);ev.target.value="";return}if(ev.target.id==="f-repeat"){readForm();render()}});
document.addEventListener("input",ev=>{if(ev.target.id==="todoIn"){todoDraft=ev.target.value;return}if(ev.target.id==="quick")quickText=ev.target.value;else if(ev.target.closest("#planForm"))readForm()});
document.addEventListener("keydown",ev=>{
  if(ev.target.id==="tedit"){if(ev.key==="Enter"){ev.preventDefault();saveTodoEdit()}else if(ev.key==="Escape"){todoEdit=null;render()}return}
  if(ev.key==="Enter"&&ev.target.matches("[data-open]"))openSheet(ev.target.dataset.open);
  if(ev.key==="Escape")$(".sheet-bg")?.remove();
});
